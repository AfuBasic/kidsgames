<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <link rel="manifest" href="../../../manifest.webmanifest">
  <meta name="theme-color" content="#a9d4ee">
  <link rel="icon" href="../../../icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="../../../icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Word Games">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Word Slots</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../../shared/theme.css">
  <link rel="stylesheet" href="style.css">
</head>
<body data-home="../../../">
  <header class="hud">
    <button class="round-button replay glass" aria-label="Hear the word again"></button>
    <div class="progress glass" aria-label="Progress to the next star">
      <div class="dots"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
      <div class="star-count"><span class="star-icon"></span><span class="star-number">0</span></div>
    </div>
  </header>

  <main class="board">
    <div id="picture" class="picture glass"></div>

    <div class="machine">
      <div class="marquee" aria-hidden="true"></div>
      <div id="window" class="window" aria-live="polite"></div>
      <div class="lever" aria-hidden="true"><div class="base"></div><div class="stick"><div class="knob"></div></div></div>
    </div>

    <div id="made" class="made" aria-label="Words made"></div>
    <div id="choices" class="choices" aria-label="Letters"></div>
  </main>

  <section id="start" class="overlay start">
    <div class="card glass">
      <div class="start-tiles" aria-hidden="true">
        <span class="tile" style="--color: #c2569a; --shade: #86336a">h</span>
        <span class="tile" style="--color: #5f63d0; --shade: #383b92">a</span>
        <span class="tile" style="--color: #5f63d0; --shade: #383b92">t</span>
      </div>
      <h1>Word Slots</h1>
      <p class="tagline">Change the first letter. Make a new word!</p>
      <button id="play" class="big-button">Play</button>
      <details class="settings">
        <summary>Settings for grown-ups</summary>
        <fieldset>
          <legend>Words</legend>
          <label><input type="radio" name="length" value="3" checked> <strong>3 letters</strong><small>cat, hat, mat</small></label>
          <label><input type="radio" name="length" value="4"> <strong>4 letters</strong><small>sock, rock, lock</small></label>
          <label><input type="radio" name="length" value="both"> <strong>Both</strong><small>Mix them up</small></label>
        </fieldset>
        <fieldset>
          <legend>Start with</legend>
          <label><input type="radio" name="start-level" value="0" checked> <strong>2 letters</strong><small>to choose from</small></label>
          <label><input type="radio" name="start-level" value="1"> <strong>3 letters</strong><small>to choose from</small></label>
          <label><input type="radio" name="start-level" value="2"> <strong>4 letters</strong><small>to choose from</small></label>
        </fieldset>
        <p class="note" id="family-note"></p>
      </details>
    </div>
  </section>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="../../../shared/pictures.js"></script>
  <script src="../../../shared/pictures-2.js"></script>
  <script src="../../../shared/pictures-3.js"></script>
  <script src="../../../shared/pictures-4.js"></script>
  <script src="../../../shared/words.js"></script>
  <script src="../../../shared/numbers.js"></script>
  <script src="../../../shared/phrases.js"></script>
  <script src="../../../shared/sounds.js"></script>
  <script src="../../../shared/voice.js"></script>
  <script src="../../../shared/scene.js"></script>
  <script src="../../../shared/effects.js"></script>
  <script src="../../../shared/deck.js"></script>
  <script src="game.js"></script>
</body>
</html>
