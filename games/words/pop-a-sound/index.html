<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <link rel="manifest" href="../../../manifest.webmanifest">
  <meta name="theme-color" content="#a9d4ee">
  <link rel="icon" href="../../../icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="../../../icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Word Games">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Pop-a-Sound</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../../shared/theme.css">
  <link rel="stylesheet" href="style.css">
</head>
<body data-home="../../../">
  <header class="hud">
    <button class="round-button replay glass" aria-label="Hear the question again"></button>
    <div id="clue" class="clue glass" aria-live="polite">
      <div id="clue-pic" class="clue-pic"></div>
      <div id="clue-word" class="clue-word"></div>
    </div>
    <div class="progress glass" aria-label="Progress to the next star">
      <div class="dots"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
      <div class="star-count"><span class="star-icon"></span><span class="star-number">0</span></div>
    </div>
  </header>

  <main id="balloons"></main>

  <section id="start" class="overlay start">
    <div class="card glass">
      <div id="start-balloons" aria-hidden="true"></div>
      <h1>Pop-a-Sound</h1>
      <p class="tagline">Listen. Find the sound. Pop!</p>
      <button id="play" class="big-button">Play</button>
      <details class="settings">
        <summary>Settings for grown-ups</summary>
        <fieldset>
          <legend>Letters</legend>
          <div id="group-options"></div>
        </fieldset>
        <fieldset>
          <legend>Sounds to find</legend>
          <label><input type="radio" name="positions" value="grow" checked> <strong>Grow</strong><small>Adds last, then middle sounds</small></label>
          <label><input type="radio" name="positions" value="first"> <strong>First</strong><small>Just first sounds</small></label>
          <label><input type="radio" name="positions" value="mix"> <strong>Mix</strong><small>All sounds from the start</small></label>
        </fieldset>
        <fieldset>
          <legend>Start with</legend>
          <label><input type="radio" name="start-level" value="0" checked> <strong>2</strong><small>balloons</small></label>
          <label><input type="radio" name="start-level" value="1"> <strong>3</strong><small>balloons</small></label>
          <label><input type="radio" name="start-level" value="2"> <strong>5</strong><small>balloons</small></label>
        </fieldset>
        <fieldset>
          <legend>Clues</legend>
          <label><input type="checkbox" id="show-word" checked> <span><strong>Word clue</strong><small>Show the word under the picture</small></span></label>
        </fieldset>
        <p class="note">Every 5 pops earns a star, and every 2 stars adds more balloons. Each letter group adds more words, and the game works through every word before repeating one.</p>
      </details>
    </div>
  </section>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="../../../shared/pictures.js"></script>
  <script src="../../../shared/pictures-2.js"></script>
  <script src="../../../shared/pictures-3.js"></script>
  <script src="../../../shared/pictures-4.js"></script>
  <script src="../../../shared/words.js"></script>
  <script src="../../../shared/numbers.js"></script>
  <script src="../../../shared/phrases.js"></script>
  <script src="../../../shared/sounds.js"></script>
  <script src="../../../shared/voice.js"></script>
  <script src="../../../shared/scene.js"></script>
  <script src="../../../shared/effects.js"></script>
  <script src="../../../shared/deck.js"></script>
  <script src="game.js"></script>
</body>
</html>
