<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <link rel="manifest" href="../../../manifest.webmanifest">
  <meta name="theme-color" content="#a9d4ee">
  <link rel="icon" href="../../../icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="../../../icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Word Games">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Blend Robot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../../shared/theme.css">
  <link rel="stylesheet" href="style.css">
</head>
<body data-home="../../../">
  <header class="hud">
    <button class="round-button replay glass" aria-label="Hear the robot again"></button>
    <div class="progress glass" aria-label="Progress to the next star">
      <div class="dots"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
      <div class="star-count"><span class="star-icon"></span><span class="star-number">0</span></div>
    </div>
  </header>

  <main class="board">
    <div id="robot" class="robot" aria-hidden="true"></div>
    <div id="picks" class="picks" aria-label="Pictures"></div>
  </main>

  <section id="start" class="overlay start">
    <div class="card glass">
      <div id="start-robot" class="start-robot" aria-hidden="true"></div>
      <h1>Blend Robot</h1>
      <p class="tagline">The robot says a word slowly. Find the picture!</p>
      <button id="play" class="big-button">Play</button>
      <details class="settings">
        <summary>Settings for grown-ups</summary>
        <fieldset>
          <legend>Words</legend>
          <label><input type="radio" name="length" value="3" checked> <strong>3 letters</strong><small>cat, bus, hen</small></label>
          <label><input type="radio" name="length" value="all"> <strong>3 and 4 letters</strong><small>adds frog, lamp</small></label>
        </fieldset>
        <fieldset>
          <legend>Start at</legend>
          <label><input type="radio" name="start-level" value="0" checked> <strong>Level 1</strong><small>2 pictures</small></label>
          <label><input type="radio" name="start-level" value="1"> <strong>Level 2</strong><small>3 pictures, one starts the same</small></label>
          <label><input type="radio" name="start-level" value="2"> <strong>Level 3</strong><small>4 pictures, plus a rhyme</small></label>
        </fieldset>
        <fieldset>
          <legend>Robot screen</legend>
          <label><input type="checkbox" id="show-letters" checked> <span><strong>Show letters</strong><small>Light them up as the robot speaks</small></span></label>
        </fieldset>
        <p class="note">The robot says each word at half speed ("caaat") so children can hear every sound, which builds blending. Every 5 right answers earns a star, and each star moves up a level.</p>
      </details>
    </div>
  </section>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="../../../shared/pictures.js"></script>
  <script src="../../../shared/pictures-2.js"></script>
  <script src="../../../shared/pictures-3.js"></script>
  <script src="../../../shared/pictures-4.js"></script>
  <script src="../../../shared/words.js"></script>
  <script src="../../../shared/numbers.js"></script>
  <script src="../../../shared/phrases.js"></script>
  <script src="../../../shared/sounds.js"></script>
  <script src="../../../shared/voice.js"></script>
  <script src="../../../shared/scene.js"></script>
  <script src="../../../shared/effects.js"></script>
  <script src="../../../shared/deck.js"></script>
  <script src="game.js"></script>
</body>
</html>
